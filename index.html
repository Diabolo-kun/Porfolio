<!--!
 * @file index.html
 * @brief Página principal del Portfolio Web interactivo.
 * @author Manuel Perez
 -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio - Informática, Electrónica y Robótica</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/submenu.css">
    <style>
        #lang-toggle-container {
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            font-family: var(--font-heading); font-weight: 700; color: white;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
        }
        .lang-btn {
            background: none; border: none; color: inherit; cursor: pointer; 
            font-size: 1.2rem; opacity: 0.5; transition: all 0.3s ease;
        }
        .lang-btn.active { opacity: 1; color: var(--color-yellow); }
        .lang-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div id="game-container">

    <!-- SELECTOR DE IDIOMA GLOBAL -->
    <div id="lang-toggle-container">
        <button class="lang-btn active" data-lang="es">ES</button>
        <span style="opacity: 0.5; margin: 0 5px;">|</span>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <!-- FASE DE INTRO -->
    <section id="intro" class="intro-screen">
        <div class="intro-content">
            <div class="intro-left">
                <h1 class="intro-name">
                    <span class="name-line">Manuel</span>
                    <span class="name-line">Perez</span>
                    <span class="name-line">Garcia</span>
                </h1>
            </div>
            <div class="intro-right">
                <div class="intro-photo-wrapper">
                    <img src="img/intro-photo.jpg" alt="Manuel Perez Garcia" class="intro-photo">
                </div>
            </div>
        </div>
        <button id="start-btn" class="start-button" data-i18n="start">START</button>
        <div class="intro-bg-elements">
            <div class="intro-line intro-line-1"></div>
            <div class="intro-line intro-line-2"></div>
            <div class="intro-line intro-line-3"></div>
        </div>
    </section>

    <!-- OVERLAY DE TRANSICIÓN: Grid 3x3 -->
    <div id="grid-overlay" class="grid-overlay hidden">
        <div class="grid-cell" data-row="0" data-col="0"></div>
        <div class="grid-cell" data-row="0" data-col="1"></div>
        <div class="grid-cell" data-row="0" data-col="2"></div>
        <div class="grid-cell" data-row="1" data-col="0"></div>
        <div class="grid-cell" data-row="1" data-col="1"></div>
        <div class="grid-cell" data-row="1" data-col="2"></div>
        <div class="grid-cell" data-row="2" data-col="0"></div>
        <div class="grid-cell" data-row="2" data-col="1"></div>
        <div class="grid-cell" data-row="2" data-col="2"></div>
        <svg class="grid-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line class="grid-line h-line" x1="0" y1="33.33" x2="100" y2="33.33"/>
            <line class="grid-line h-line" x1="0" y1="66.66" x2="100" y2="66.66"/>
            <line class="grid-line v-line" x1="33.33" y1="0" x2="33.33" y2="100"/>
            <line class="grid-line v-line" x1="66.66" y1="0" x2="66.66" y2="100"/>
        </svg>
    </div>

    <!-- MENÚ PRINCIPAL Y CONTENIDO -->
    <main id="main-layout" class="hidden">
        
        <!-- Partículas decorativas (estilo P5) -->
        <div class="particles-container">
            <!-- Centro/Derecha -->
            <div class="particle-arrow-group">
                <div class="particle-arrow-body"></div>
                <div class="particle-arrow-head"></div>
            </div>
            <div class="particle-dots dots-right"></div>
            <div class="particle-stripes">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="particle-square sq-1"></div>
            <div class="particle-square sq-2"></div>
            <div class="particle-square sq-3"></div>
            <div class="particle-red-box"></div>
            
            <!-- Izquierda -->
            <div class="particle-square sq-4"></div>
            <div class="particle-circle circle-left"></div>
            <div class="particle-dots dots-left"></div>
            <div class="particle-cross cross-left"></div>
        </div>
        
        <!-- Retrato Cara.png - fondo centrado, altura completa -->
        <div class="portrait-bg">
            <img id="portrait-base" src="img/Cara.png" alt="Retrato Geométrico" class="portrait-img">
        </div>

        <!-- Capa de menú y contenido (superpuesta sobre el retrato) -->
        <section class="menu-layer" id="right-panel">
            
            <!-- CONTENEDOR DEL MENÚ PRINCIPAL -->
            <div id="main-menu-container" class="view-container active">
                <header class="bauhaus-header">
                    <nav class="main-nav" id="main-nav">
                        <button class="nav-btn" data-target="perfil" data-index="0">
                            <span class="btn-bg bg-yellow"></span>
                            <span class="btn-text" data-i18n="menu_profile">PERFIL</span>
                        </button>
                        <button class="nav-btn" data-target="proyectos" data-index="1">
                            <span class="btn-bg bg-cyan"></span>
                            <span class="btn-text" data-i18n="menu_projects">PROYECTOS</span>
                        </button>
                        <button class="nav-btn" data-target="experiencia" data-index="2">
                            <span class="btn-bg bg-coral"></span>
                            <span class="btn-text" data-i18n="menu_experience">EXPERIENCIA</span>
                        </button>
                        <!-- NUEVOS BOTONES DIRECTOS -->
                        <button class="nav-btn direct-action" data-action="link" data-url="https://linkedin.com/in/tu-perfil" data-index="3">
                            <span class="btn-bg bg-yellow"></span>
                            <span class="btn-text" data-i18n="menu_linkedin">LINKEDIN</span>
                        </button>
                        <button class="nav-btn direct-action" data-action="mailto" data-email="tu-correo@gmail.com" data-index="4">
                            <span class="btn-bg bg-cyan"></span>
                            <span class="btn-text" data-i18n="menu_email">EMAIL</span>
                        </button>
                        <button class="nav-btn direct-action" data-action="download" data-file="cv.pdf" data-index="5">
                            <span class="btn-bg bg-coral"></span>
                            <span class="btn-text" data-i18n="menu_cv">CV (PDF)</span>
                        </button>
                    </nav>
                </header>
                <div class="menu-instructions">
                    <p data-i18n="inst_nav">Usa <span>↑</span> <span>↓</span> para navegar | <span>ENTER</span> para seleccionar</p>
                    <p style="margin-top: 10px;">
                        <button id="back-to-intro-btn" class="discrete-btn" data-i18n="inst_esc"><span>ESC</span> para volver al inicio</button>
                    </p>
                </div>
            </div>
        </section>

        <!-- CONTENEDOR DE SUBMENÚS (Pantalla dividida 50/50) -->
        <section id="submenu-container" class="view-container hidden">
            
            <!-- Botón Volver -->
            <button id="back-btn" class="back-button" data-i18n="btn_back">
                <span class="back-icon">◀</span> VOLVER [ESC]
            </button>

            <!-- Mitad Izquierda (Listas) -->
            <div class="submenu-left">
                <!-- Título rojo superior -->
                <div class="submenu-header">
                    <span id="submenu-title-text">WHICH ITEM?</span>
                </div>

                <!-- Contenedor de las listas -->
                <div class="submenu-list-container custom-scrollbar">
                    
                    <!-- Lista PERFIL -->
                    <div id="perfil" class="content-section">
                        <div class="list-pane" id="perfil-list">
                            <p class="loading-text" data-i18n="load_profile" style="color:white;text-align:center;margin-top:20px;">Cargando perfil...</p>
                        </div>
                    </div>

                    <!-- Lista PROYECTOS -->
                    <div id="proyectos" class="content-section">
                        <div class="list-pane" id="github-list">
                            <p class="loading-text" data-i18n="load_projects" style="color:white;text-align:center;margin-top:20px;">Cargando proyectos...</p>
                        </div>
                    </div>

                    <!-- Lista EXPERIENCIA -->
                    <div id="experiencia" class="content-section">
                        <div class="list-pane" id="exp-list">
                            <p class="loading-text" data-i18n="load_experience" style="color:white;text-align:center;margin-top:20px;">Cargando experiencia...</p>
                        </div>
                    </div>

                </div>

                <!-- Panel de descripción del ítem seleccionado (estilo P5) -->
                <div class="item-description" id="item-description" style="display: none;">
                    <p id="item-description-text" data-i18n="desc_placeholder">Selecciona un elemento para ver su descripción.</p>
                </div>
            </div>

            <!-- Mitad Derecha (Silueta) -->
            <div class="submenu-right">
                <div class="silhouette-placeholder">
                    <span>(Espacio para Silueta)</span>
                </div>
            </div>

            <!-- VENTANA DE DESCRIPCION SUPERPUESTA -->
            <div id="desc-overlay" class="desc-overlay">
                <div class="desc-inner">
                    <div class="shape-left"></div>
                    <div class="shape-right"></div>
                    <div class="desc-content-wrap">
                        <div class="desc-header-box">
                            <h2 id="desc-title-overlay">TITULO</h2>
                        </div>
                        <p id="desc-text-overlay">Descripción...</p>
                    </div>
                </div>
            </div>
        </section>

    </main>
    </div>

    <!-- Scripts Modulares -->
    <script defer src="js/state.js"></script>
    <script defer src="js/i18n.js"></script>
    <script defer src="js/transitions.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/data.js"></script>
</body>
</html>
